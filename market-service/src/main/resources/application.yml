spring:
  application:
    name: market-service
  profiles:
    default: local
  cloud:
    openfeign:
      client:
        config:
          member-point-internal:
            connectTimeout: ${MEMBER_POINT_CONNECT_TIMEOUT_MILLIS:3000}
            readTimeout: ${MEMBER_POINT_READ_TIMEOUT_MILLIS:5000}
          insight-reputation-internal:
            connectTimeout: ${INSIGHT_CONNECT_TIMEOUT_MILLIS:3000}
            readTimeout: ${INSIGHT_READ_TIMEOUT_MILLIS:5000}

server:
  port: ${SERVER_PORT:8082}

client:
  member-point:
    mode: ${MEMBER_POINT_CLIENT_MODE:fake}
    base-url: ${MEMBER_POINT_SERVICE_URL:http://localhost:8080}
    connect-timeout-millis: ${MEMBER_POINT_CONNECT_TIMEOUT_MILLIS:3000}
    read-timeout-millis: ${MEMBER_POINT_READ_TIMEOUT_MILLIS:5000}
  insight:
    mode: ${INSIGHT_CLIENT_MODE:fake}
    base-url: ${INSIGHT_SERVICE_URL:http://localhost:8083}

# ── Kafka ──────────────────────────────────────────────────
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    acks: all
    retries: 3
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      max.in.flight.requests.per.connection: 5
  consumer:
    group-id: market-service
    auto-offset-reset: earliest
    enable-auto-commit: false
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  listener:
    ack-mode: manual

# ── 관측성 ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

market:
  scheduler:
    prediction-reconciliation:
      enabled: true
      fixed-delay-ms: 60000
      limit: 100
    settlement-retry:
      enabled: true
      fixed-delay-ms: 180000
      limit: 50
    refund-retry:
      enabled: true
      fixed-delay-ms: 180000
      limit: 50
    reputation-update:
      enabled: ${MARKET_REPUTATION_UPDATE_SCHEDULER_ENABLED:true}
      fixed-delay-ms: ${MARKET_REPUTATION_UPDATE_SCHEDULER_FIXED_DELAY_MS:180000}
      limit: ${MARKET_REPUTATION_UPDATE_SCHEDULER_LIMIT:50}
