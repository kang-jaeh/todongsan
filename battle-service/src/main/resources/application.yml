spring:
  application:
    name: battle-service

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

server:
  port: 8081

external:
  member-point:
    url: ${MEMBER_POINT_SERVICE_URL:http://localhost:8080}
  insight:
    url: ${INSIGHT_SERVICE_URL:http://localhost:8083}
  internal-auth-token: ${INTERNAL_AUTH_TOKEN}

# ── Kafka ──────────────────────────────────────────────────
# 프로덕션 기준: bootstrap-servers는 브로커 3대 이상 나열
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  producer:
    acks: all                        # 모든 ISR 복제본이 확인해야 발행 성공
    # enable.idempotence: true       # acks=all이면 Spring Kafka가 자동 활성화
    retries: 3
    properties:
      max.in.flight.requests.per.connection: 5  # 멱등 프로듀서 최대 허용값
      # 프로덕션: replication.factor=3, min.insync.replicas=2
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── 관측성 ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.todongsan: DEBUG
