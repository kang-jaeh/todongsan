spring:
  application:
    name: member-point-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50  # 부하테스트 대응. 프로덕션: 서비스 인스턴스 수 × pool-size ≤ DB max_connections
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 21600000
  refresh-token-expiry: 5184000000

kakao:
  api-base-url: https://kapi.kakao.com

crypto:
  aes-key: ${CRYPTO_AES_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Kafka ──────────────────────────────────────────────────
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: member-point-service
    auto-offset-reset: earliest
    enable-auto-commit: false       # 처리 완료 후 수동 ack (at-least-once)
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  listener:
    ack-mode: manual                # AcknowledgingMessageListener로 수동 커밋

# ── 관측성 ─────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  tracing:
    sampling:
      probability: 1.0  # 로컬: 전수 샘플링. 프로덕션: 0.1~0.5
    propagation:
      type: b3           # Kafka 헤더 전파 호환
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

logging:
  level:
    com.todongsan.memberpointservice: DEBUG
    org.hibernate.SQL: DEBUG
    io.netty.resolver.dns.DnsServerAddressStreamProviders: OFF
